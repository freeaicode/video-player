<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>视频播放器</title>
  <style>
    :root {
      --bg: #000;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .player-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }
    .video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      outline: none;
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script defer src="./player.js"></script>
</head>
<body>
  <div class="player-container">
    <video
      id="liveVideo"
      class="video"
      controls
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
      preload="auto"
    ></video>
  </div>
  <!-- 隐藏的表单及其他元素，保持 player.js 依赖的 ID 不变以防脚本报错 -->
  <div style="display:none;">
    <details id="streamPanel"><summary></summary></details>
    <form id="streamForm"><input id="streamInput" type="text" /><button type="submit"></button></form>
    <input id="proxyToggle" type="checkbox" />
    <div id="streamOptions"><select id="streamOptionSelect"></select></div>
    <select id="qualitySelect"><option value="auto">自动</option></select>
    <button id="reloadButton" type="button"></button>
    <button id="fullscreenButton" type="button"></button>
    <div id="status" role="status"></div>
  </div>
</body>
</html>
